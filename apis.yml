aid: acala
name: Acala
description: >-
  Acala is the decentralized finance (DeFi) and liquidity hub of the Polkadot
  ecosystem, operating the Acala parachain (and its Kusama-based sister network
  Karura). Acala offers a scalable, Ethereum-compatible smart-contract platform
  called Acala EVM+, a decentralized stablecoin (aUSD), a liquid staking
  derivative (LDOT/LcDOT), and a trustless staking and swap layer. For
  developers, Acala EVM+ exposes a standard Ethereum JSON-RPC interface through
  its EVM+ RPC Adapter (eth-rpc-adapter), letting existing Ethereum dApps,
  wallets (MetaMask), and tooling (Hardhat, Remix, ethers.js, Truffle) interact
  with the Substrate-based chain with minimal changes, alongside a Substrate
  WebSocket RPC via the @acala-network Polkadot.js API and SDK packages.
