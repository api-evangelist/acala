apis:
- name: Acala EVM+ JSON-RPC
  description: >-
    Acala EVM+ exposes a standard Ethereum JSON-RPC API through the EVM+ RPC
    Adapter, which wraps Substrate RPC calls to provide Ethereum execution-apis
    compatible endpoints (eth_*, net_*, web3_*) so Ethereum dApps and tooling
    can interact with the Acala and Karura EVM+ environments. A Substrate
    WebSocket RPC is also available for Polkadot.js-based access.
